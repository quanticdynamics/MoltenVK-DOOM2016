name: DOOM2016 release

# Builds the patched libMoltenVK.dylib (universal: x86_64 + arm64) with CMake.
# Publishing a GitHub Release attaches the library and its checksum to it.
# Running it manually (Actions tab) just produces a downloadable build artifact.
on:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tool versions
        run: |
          xcodebuild -version || true
          cmake --version || brew install cmake

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0

      - name: Build
        run: cmake --build build -j "$(sysctl -n hw.ncpu)"

      - name: Package
        run: |
          mkdir -p dist
          cp -L build/MoltenVK/libMoltenVK.dylib dist/libMoltenVK.dylib
          lipo -info dist/libMoltenVK.dylib
          lipo dist/libMoltenVK.dylib -verify_arch x86_64 arm64
          ( cd dist && shasum -a 256 libMoltenVK.dylib > libMoltenVK.dylib.sha256 && cat libMoltenVK.dylib.sha256 )

      - uses: actions/upload-artifact@v4
        with:
          name: libMoltenVK-DOOM2016
          path: dist/*

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber --repo "${GITHUB_REPOSITORY}"
